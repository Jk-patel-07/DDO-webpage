<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kids Game</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 30%),
          #050505;
        color: #f5f5f5;
      }

      .card {
        width: min(640px, calc(100% - 28px));
        padding: 28px;
        border: 1px solid #2a2a2a;
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
        text-align: center;
      }

      a {
        display: inline-block;
        margin-top: 18px;
        padding: 12px 18px;
        border-radius: 12px;
        border: 1px solid #ffffff;
        background: #ffffff;
        color: #050505;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p style="margin:0 0 10px;color:#b6b6b6;letter-spacing:.08em;text-transform:uppercase;font-size:12px;">DDO Animation</p>
      <h1 style="margin:0 0 14px;">Kids Game</h1>
      <p style="margin:0;color:#c9c9c9;line-height:1.7;">
        This game route is ready. You can replace this page with your real Kids Game build anytime.
      </p>
      <a href="/apps.html">Back to Apps</a>
    </main>
  </body>
</html>
