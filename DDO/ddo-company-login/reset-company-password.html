<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DDO Company Reset Password</title>
    <link rel="stylesheet" href="/company/assets/reset-company-password.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">DDO Animation</p>
          <h1>Reset company password</h1>
          <p class="hero-copy">
            Choose a new password for your approved DDO company account and continue to login securely.
          </p>
        </div>
        <a class="nav-link" href="/company-login.html">Go to Company Login</a>
      </header>

      <section class="card">
        <div class="card-head">
          <div>
            <p class="section-label">Secure Reset</p>
            <h2>Set a new password</h2>
          </div>
          <p class="muted">The reset link works one time and expires automatically.</p>
        </div>

        <div class="banner success" id="successBanner" role="status" aria-live="polite"></div>
        <div class="banner error" id="errorBanner" role="alert" aria-live="assertive"></div>

        <form id="resetPasswordForm" novalidate>
          <label class="field">
            <span>New Password</span>
            <div class="password-field">
              <input type="password" id="newPassword" name="newPassword" minlength="6" autocomplete="new-password" />
              <button type="button" class="toggle-button" data-target="newPassword" aria-label="Show or hide new password">Show</button>
            </div>
            <small class="field-note">Use at least 6 characters.</small>
          </label>

          <label class="field">
            <span>Confirm Password</span>
            <div class="password-field">
              <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" autocomplete="new-password" />
              <button type="button" class="toggle-button" data-target="confirmPassword" aria-label="Show or hide confirm password">Show</button>
            </div>
          </label>

          <div class="button-row">
            <button type="submit" id="resetPasswordButton">Submit New Password</button>
            <a class="secondary-link hidden" id="goToLoginButton" href="/company-login.html">Go to Company Login</a>
          </div>
        </form>
      </section>
    </div>

    <script src="/company/assets/reset-company-password.js"></script>
  </body>
</html>
